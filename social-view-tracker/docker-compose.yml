services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: svt
      POSTGRES_PASSWORD: svt
      POSTGRES_DB: social_view_tracker
    ports:
      - "5432:5432"
    volumes:
      - svt_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U svt"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  svt_pgdata: